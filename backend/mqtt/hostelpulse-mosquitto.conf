# HostelPulse local MQTT broker

# Listen on network interfaces so the ESP8266 can reach the laptop broker.
# Use only on the controlled project hotspot; do not expose this port to the internet.
listener 1883

# Allow connections without a username/password for the controlled demo
allow_anonymous true

# Store broker data locally
persistence true
persistence_location C:/Users/Public/hostelpulse-mqtt/
